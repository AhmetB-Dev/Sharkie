  </head>

  <body onload="boot()">
    <div id="loadingOverlay" class="loadingOverlay" aria-label="Loading" role="status">
      <div class="spinner" aria-hidden="true"></div>
      <p>LOADING…</p>
    </div>

    <div id="startScreen" class="startScreen"></div>
    <div id="gameStage" class="gameStage d-none">
      <canvas id="canvas" width="720" height="480"></canvas>

      <button
        id="gameMenuButton"
        class="gameMenuButton"
        type="button"
        aria-label="Open game menu"
        aria-controls="pauseMenuOverlay"
        aria-expanded="false"
      >
        <span aria-hidden="true"></span>
        <span aria-hidden="true"></span>
        <span aria-hidden="true"></span>
      </button>

      <div id="pauseMenuOverlay" class="pauseMenuOverlay" aria-hidden="true">
        <section class="pauseMenuDialog" role="dialog" aria-modal="true" tabindex="-1">
          <button class="pauseMenuClose" type="button" data-menu-action="resume" aria-label="Close game menu">
            &times;
          </button>

          <p class="pauseMenuEyebrow">PAUSED</p>

          <div class="pauseMenuActions">
            <button class="pauseMenuAction pauseMenuActionPrimary" type="button" data-menu-action="resume">
              CONTINUE
            </button>
            <button class="pauseMenuAction" type="button" data-menu-action="retry">RETRY</button>
            <button
              id="pauseSoundButton"
              class="pauseMenuAction pauseMenuSound"
              type="button"
              data-menu-action="sound"
              aria-pressed="false"
            >
              <span>MUSIC</span>
              <span id="pauseSoundState" class="pauseSoundState">ON</span>
            </button>
            <button class="pauseMenuAction pauseMenuActionDanger" type="button" data-menu-action="main-menu">
              MAIN MENU
            </button>
          </div>
        </section>
      </div>
    </div>
    <div id="rotateOverlay" class="rotateOverlay">
      <div class="rotateCard">
        <div class="phone"></div>
        <h2>Bitte drehen</h2>
      </div>
    </div>

    <template id="startScreenTemplate">
      <div class="startCard">
        <div class="startIntro">
          <p class="startEyebrow">UNDERWATER ADVENTURE</p>
          <h1 class="startTitle">SHARKIE</h1>
          <p class="startDescription">
            Dive into a colorful ocean world, collect treasures and face the creatures of the deep.
          </p>
        </div>

        <div class="startActions">
          <button id="startBtn" type="button" class="pillBtn startPrimaryBtn">
            <span>START GAME</span><span class="startArrow" aria-hidden="true">→</span>
          </button>
          <button id="settingsBtn" type="button" class="pillBtn">SETTINGS</button>
          <button id="fsBtn" type="button" class="pillBtn">FULLSCREEN</button>
          <button id="impressumBtn" type="button" class="pillBtn pillBtnSmall">IMPRESSUM &amp; LEGAL</button>
        </div>

        <div id="settingsPanel" class="settingsPanel">
          <h3 class="panelTitle">Settings</h3>

          <label class="settingRow">
            <span>Sound</span>
            <input id="soundToggle" class="soundToggle" type="checkbox" />
          </label>

          <div class="settingRow">
            <span>Controls</span>
            <button id="controlsBtn" type="button" class="inlineActionBtn">OPEN</button>
          </div>

          <div class="settingsActions">
            <button id="closeSettingsBtn" type="button" class="inlineActionBtn">BACK</button>
          </div>
        </div>

        <div id="controlsPanel" class="settingsPanel">
          <h3 class="panelTitle">Controls</h3>

          <div class="controlsBlock">
            <div class="controlsGrid">
              <img class="controlsImg" src="assets/assets_sharkie/6.Botones/controls_primary.webp" />
              <img class="controlsImg" src="assets/assets_sharkie/6.Botones/controls_alternative.webp" />
            </div>
          </div>
          <div class="controlsBlock">
            <table class="controlsTable">
              <thead>
                <tr>
                  <th>Enemy</th>
                  <th>Keys</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td>Puffer Fish</td>
                  <td><span class="keyPill">J</span> <span class="keyPill">Z|Y</span></td>
                </tr>
                <tr>
                  <td>Jelly Fish</td>
                  <td><span class="keyPill">K</span> <span class="keyPill">X</span></td>
                </tr>
                <tr>
                  <td>Orca (Boss)</td>
                  <td><span class="keyPill">L</span> <span class="keyPill">C</span></td>
                </tr>
              </tbody>
            </table>
          </div>

          <div class="settingsActions">
            <button id="closeControlsBtn" type="button" class="inlineActionBtn">BACK</button>
          </div>
        </div>
        <div id="impressumPanel" class="settingsPanel impressumPanel">
          <h3 class="panelTitle">Impressum</h3>

          <div class="legalText">
            <p>
              <strong>Kontakt</strong><br />
              Ahmet Balci<br />
              c/o Online-Impressum 10794<br />

              53757 Sankt Augustin
            </p>

              <strong>Kontakt</strong><br />
              E-Mail: <span class="legalPlaceholder">Ahmet_Ba@web.de</span>
            </p>

          <div class="settingsActions">
            <button id="closeImpressumBtn" type="button" class="inlineActionBtn">BACK</button>
          </div>
        </div>
      </div>
    </template>
